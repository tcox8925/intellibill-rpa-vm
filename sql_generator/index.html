<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Metis | Agility Intelligence</title>

<style>
body {
  margin:0;
  font-family:"Segoe UI", Arial, sans-serif;
  background:#F4F7F9;
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header {
  background:#1F3E4D;
  color:white;
  padding:15px 25px;
  font-size:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.chat-container {
  flex:1;
  overflow-y:auto;
  padding:25px;
  display:flex;
  flex-direction:column;
}

.message {
  max-width:70%;
  padding:12px 15px;
  margin-bottom:12px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  animation: fadeIn 0.2s ease-in;
}


.user { background:#FFFFFF; border:1px solid #ddd; align-self:flex-end; }

.input-area {
  display:flex;
  padding:15px;
  background:white;
  border-top:1px solid #ddd;
}

input {
  flex:1;
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:14px;
}

button {
  margin-left:10px;
  padding:10px 15px;
  border-radius:6px;
  border:none;
  background:#3CB6D6;
  color:white;
  cursor:pointer;
}

button:hover { background:#2FA3C0; }

.option {
  padding:8px;
  margin-top:6px;
  background:#ffffff;
  border:1px solid #ccc;
  border-radius:6px;
  cursor:pointer;
  max-width:70%;
}

.option:hover { background:#E8F6FA; }

.reset-btn {
  background:transparent;
  color:white;
  border:1px solid white;
  font-size:12px;
  padding:4px 10px;
  cursor:pointer;
}

/* Fade animation */
@keyframes fadeIn {
  from { opacity:0; transform:translateY(4px); }
  to { opacity:1; transform:translateY(0); }
}

.typing-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
}

.typing-text {
  font-size: 13px;
  color: #1F3E4D;
}

.typing {
  display: flex;
  align-items: center;
  gap: 4px;
}

.dot {
  width:8px;
  height:8px;
  background:#3CB6D6;
  border-radius:50%;
  animation:bounce 1.2s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay:0.2s; }
.dot:nth-child(3) { animation-delay:0.4s; }

@keyframes bounce {
  0%, 80%, 100% { transform:translateY(0); }
  40% { transform:translateY(-6px); }
}
.clarify-card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 14px 16px;
  width: 260px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}

.clarify-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  color: #1F3E4D;
}

.clarify-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.clarify-option {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  cursor: pointer;
}

.clarify-option input {
  accent-color: #3CB6D6;
  transform: scale(0.9);
}

.clarify-btn {
  width: 100%;
  padding: 6px;
  font-size: 13px;
  border-radius: 6px;
  border: none;
  background: #3CB6D6;
  color: white;
  cursor: pointer;
  transition: background 0.2s ease;
}

.clarify-btn:hover {
  background: #2FA3C0;
}
.clarify-line {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.clarify-name {
  font-size: 13px;
  font-weight: 500;
  color: #1F3E4D;
}

.clarify-sub {
  font-size: 11px;
  color: #6b7280;
}

</style>
</head>
<body>

<div class="header">
  <div>Metis — Agility Data Intelligence</div>
  <button class="reset-btn" onclick="resetChat()">Reset</button>
</div>

<div id="chat" class="chat-container"></div>

<div class="input-area">
  <input id="userInput"
         placeholder="Ask a data question..."
         onkeydown="if(event.key==='Enter') sendMessage()" />
  <button onclick="sendMessage()">Send</button>
</div>

<script>

let lastQuestion = null;
let typingIndicator = null;
let isLoading = false;

/* ---------- Greeting ---------- */

async function showGreeting() {
  try {
    const response = await fetch("/");
    const data = await response.json();
    addMessage(data.message);
  } catch {
    addMessage("Hello. I’m Metis — your Agility Data Intelligence assistant.");
  }
}

/* ---------- Safe Message Rendering ---------- */

function addMessage(text, sender="assistant", allowHTML=false) {
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = `message ${sender}`;

  if (allowHTML) {
    msg.innerHTML = text;
  } else {
    msg.innerText = text;
  }

  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- Typing Animation ---------- */

function showTyping() {
  const chat = document.getElementById("chat");

  typingIndicator = document.createElement("div");
  typingIndicator.className = "message assistant";

  typingIndicator.innerHTML = `
    <div class="typing-wrapper">
      <div class="typing-text">Metis is typing</div>
      <div class="typing">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  `;

  chat.appendChild(typingIndicator);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  if (typingIndicator) {
    typingIndicator.remove();
    typingIndicator = null;
  }
}

/* ---------- Reset ---------- */

function resetChat() {
  document.getElementById("chat").innerHTML = "";
  showGreeting();
}

function clearOptions() {
  document.querySelectorAll(".option").forEach(el => el.remove());
}

/* ---------- Send ---------- */

async function sendMessage(resolvedFilters = null) {

  const input = document.getElementById("userInput");
  const question = resolvedFilters ? lastQuestion : input.value;

  if (!question) return;

  // prevent double-click spam, but allow clarification
  if (isLoading && !resolvedFilters) return;

  if (!resolvedFilters) {
    clearOptions();
    addMessage(question, "user");
    input.value = "";
  }

  lastQuestion = question;
  isLoading = true;

  showTyping();

  const payload = {
    question: question,
    resolved_filters: resolvedFilters
  };

  try {
    const response = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    handleResponse(data);

  } catch (e) {
    console.error("API error:", e);
    addMessage("An unexpected error occurred.");
  } finally {
    removeTyping();
    isLoading = false;   // 🔥 GUARANTEED RESET
  }
}

/* ---------- Response Handling ---------- */

function handleResponse(data) {

  clearOptions();

  if (data.status === "clarification_required") {

    addMessage(data.message);

    if (data.options && data.resolution_type) {

      const container = document.createElement("div");
      container.className = "message assistant";

      let html = `
        <div class="clarify-card">
          <div class="clarify-title">Select one or more</div>
          <div class="clarify-options">
      `;

      data.options.forEach(option => {
        html += `
          <label class="clarify-option">
            <input type="checkbox"
                   name="clarify"
                   value="${option.resolve_value}" />
            <div class="clarify-line">
              <div class="clarify-name">${option.display_value}</div>
              ${data.resolution_type === "agent" ||
              data.resolution_type === "upline" ||
              data.resolution_type === "top_upline" ||
              data.resolution_type === "member"
              ? `<div class="clarify-sub">NPN: ${option.resolve_value}</div>`
              : ""}
            </div>
          </label>
        `;
      });

      html += `
            </div>
            <button class="clarify-btn">Apply</button>
          </div>
      `;

      container.innerHTML = html;
      document.getElementById("chat").appendChild(container);

      container.querySelector(".clarify-btn").addEventListener("click", () => {

        const selected = Array.from(
          container.querySelectorAll("input[name='clarify']:checked")
        ).map(cb => cb.value);

        if (!selected.length) return;

        sendMessage({ [data.resolution_type]: selected });
      });
    }

    return;
  }

  if (data.status === "success") {

    if (data.result_type === "kpi") {

      const value = Number(data.result.value || 0).toLocaleString();

      addMessage(`
        <div style="font-size:22px;font-weight:600;color:#1F3E4D;">
          ${value}
        </div>
      `, "assistant", true);

      return;
    }

    if (data.result_type === "table") {

      if (!data.result || !data.result.length) {
        addMessage("No records found.");
        return;
      }

      renderTable(data.result);
      return;
    }

    return;
  }

  addMessage("An error occurred while processing your request.");
}

/* ---------- Summary Renderer ---------- */

function renderSummary(row) {

  let html = "<div>";

  Object.entries(row).forEach(([key, value]) => {
    if (value === null || value === undefined) value = "";
    html += `<div><strong>${key}:</strong> ${value}</div>`;
  });

  html += "</div>";

  addMessage(html, "assistant", true);
}

/* ---------- Table Renderer ---------- */

function renderTable(rows) {

  const headers = Object.keys(rows[0]);

  let html = `<div style="overflow-x:auto;">
                <table style="border-collapse:collapse;width:100%;font-size:13px;">`;

  html += "<tr>";
  headers.forEach(h => {
    html += `<th style="border:1px solid #ddd;padding:6px;background:#f0f0f0;text-align:left;">
              ${h}
            </th>`;
  });
  html += "</tr>";

  rows.forEach(row => {
    html += "<tr>";
    headers.forEach(h => {
      let value = row[h];
      if (value === null || value === undefined) value = "";
      html += `<td style="border:1px solid #ddd;padding:6px;">${value}</td>`;
    });
    html += "</tr>";
  });

  html += "</table></div>";

  addMessage(html, "assistant", true);
}

document.addEventListener("DOMContentLoaded", () => {
  showGreeting();
});

</script>
</body>
</html>
